<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediFinder - Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/9dec450bb1.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="UserDashboard.css">
</head>
<body>

    <!-- ===================== SIDEBAR ===================== -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <div class="sidebar-inner">
            <div class="sidebar__logo">
                <div class="sidebar__logo-icon">
                    <img src="Images/Logo.png" alt="MediFinder Logo">
                </div>
                <div class="sidebar__logo-text">
                    <span class="sidebar__brand">MediFinder</span>
                    <span class="sidebar__portal">User Portal</span>
                </div>
            </div>
            <nav class="sidebar__nav">
                <a href="UserDashboard.html" class="nav-item nav-item--active">
                    <i class="fa-solid fa-table-cells-large nav-item__icon"></i>
                    <span>Dashboard</span>
                </a>
                <a href="UserPharmacySearch.html" class="nav-item">
                    <i class="fa-solid fa-magnifying-glass nav-item__icon"></i>
                    <span>Pharmacy Search</span>
                </a>
                <a href="UserProfile.html" class="nav-item">
                    <i class="fa-regular fa-user nav-item__icon"></i>
                    <span>Profile</span>
                </a>
                <a href="UserHistory.html" class="nav-item">
                    <i class="fa-solid fa-clock-rotate-left nav-item__icon"></i>
                    <span>My History</span>
                </a>
                <a href="UserReminders.html" class="nav-item">
                    <i class="fa-regular fa-bell nav-item__icon"></i>
                    <span>Set Reminders</span>
                </a>
            </nav>
            <div class="sidebar__user">
                <div class="user-avatar">
                    <img src="Images/ProfileAvatar.jpg" alt="User"
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
                    <div class="user-avatar__fallback" style="display:none">
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>
                <div class="user-meta">
                    <span class="user-name"></span>
                    <span class="user-email"></span>
                </div>
                <a href="#" class="user-logout" id="logoutBtn" title="Log out">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                </a>
            </div>
        </div>
    </aside>

    <!-- ===================== MAIN CONTENT ===================== -->
    <main class="main">

        <header class="topbar">
            <button class="topbar__hamburger" id="hamburgerBtn" aria-label="Toggle sidebar">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="topbar__welcome">
                <h1></h1>
                <p>Keep track of your health and pharmacy needs.</p>
            </div>
        </header>

        <!-- ── Stat Cards Row ── -->
        <section class="stat-grid">

            <!-- Total Reminders — value injected by JS -->
            <div class="stat-card">
                <div class="stat-card__icon stat-card__icon--blue">
                    <i class="fa-solid fa-bell"></i>
                </div>
                <div class="stat-card__body">
                    <p class="stat-card__label">Total Reminders</p>
                    <p class="stat-card__value" id="totalRemindersCount">
                        <i class="fa-solid fa-spinner fa-spin" style="font-size:22px;color:var(--gray-mid)"></i>
                    </p>
                </div>
            </div>

            <!-- Search Analytics card — values injected by JS -->
            <div class="stat-card">
                <div class="stat-card__icon stat-card__icon--green">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                <div class="stat-card__body">
                    <p class="stat-card__label">Search Analytics</p>
                    <p class="stat-card__sublabel--label">Most Searched</p>
                    <p class="stat-card__value--sm" id="mostSearchedValue">—</p>
                    <p class="stat-card__sublabel--label" style="margin-top:6px">Last Search</p>
                    <p class="stat-card__sublabel" id="lastSearchValue">—</p>
                </div>
            </div>

        </section>

        <!-- ── Panels Row ── -->
        <section class="panel-grid">

            <!-- Upcoming Reminders Panel — items injected by JS -->
            <div class="panel">
                <div class="panel__header">
                    <h2 class="panel__title">Upcoming Reminders</h2>
                    <a href="UserReminders.html" class="panel__link panel__link--green">See all</a>
                </div>

                <ul class="reminder-list" id="upcomingReminderList">
                    <!-- Loading state — replaced by JS -->
                    <li class="reminder-item">
                        <div class="reminder-item__icon">
                            <i class="fa-solid fa-spinner fa-spin"></i>
                        </div>
                        <div class="reminder-item__info">
                            <span class="reminder-item__name" style="color:var(--gray-mid)">Loading…</span>
                        </div>
                    </li>
                </ul>
            </div>

            <!-- Recent Searches Panel — populated by loadRecentSearches() -->
            <div class="panel">
                <div class="panel__header">
                    <h2 class="panel__title">Recent Searches</h2>
                    <a href="UserHistory.html" class="panel__link panel__link--green">View History</a>
                </div>
                <ul class="search-list" id="recentSearchList">
                    <li class="search-item search-item--loading">
                        <div class="search-item__icon">
                            <i class="fa-solid fa-spinner fa-spin"></i>
                        </div>
                        <div class="search-item__info">
                            <span class="search-item__name" style="color:var(--gray-mid)">Loading…</span>
                        </div>
                    </li>
                </ul>
            </div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="fcm-init.js"></script>
    <script src="UserDashboard.js"></script>
</body>
</html>
